<!doctype html>
<html class="locale-vi" lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="TEngLish - Web học tiếng Anh từ mất gốc đến thành thạo" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>T-English - Học Tiếng Anh</title>

  <script>
    try {
      window.__appBootStartTime = Date.now();
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>

  <style>
    /* ══════════════════════════════════════════════════════════════════ */
    /* ZERO-LATENCY INLINED BOOT SPLASH SCREEN (0ms Paint, 120 FPS Fluid) */
    /* ══════════════════════════════════════════════════════════════════ */
    #app-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 32px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .dark #app-boot-splash {
      background: #090d16;
    }
    #app-boot-splash.splash-fade-out {
      opacity: 0;
      transform: scale(1.05);
      filter: blur(8px);
      pointer-events: none;
    }

    /* Ambient Glowing Neon Blobs */
    .splash-glow-1 {
      position: absolute;
      top: -12%;
      right: -12%;
      width: 70vw;
      height: 70vw;
      max-width: 380px;
      max-height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .splash-glow-2 {
      position: absolute;
      bottom: -12%;
      left: -12%;
      width: 70vw;
      height: 70vw;
      max-width: 380px;
      max-height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(168, 85, 247, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .dark .splash-glow-1 {
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(99, 102, 241, 0) 70%);
    }
    .dark .splash-glow-2 {
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(56, 189, 248, 0) 70%);
    }

    /* Mascot Glass Showcase Squircle */
    .splash-mascot-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 130px;
      height: 130px;
      border-radius: 36px;
      animation: splashFloat 2.6s ease-in-out infinite;
    }
    .splash-mascot-img {
      width: 126px;
      height: 126px;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(99, 102, 241, 0.35));
    }
    .splash-mascot-halo {
      position: absolute;
      inset: -14px;
      border-radius: 44px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(168, 85, 247, 0) 70%);
      z-index: -1;
      animation: splashPulse 2.6s ease-in-out infinite;
    }

    /* Brand Name */
    .splash-brand {
      margin: 22px 0 0 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .dark .splash-brand {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Subtitle Tagline */
    .splash-tagline {
      margin: 6px 0 0 0;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.1px;
    }
    .dark .splash-tagline {
      color: #94a3b8;
    }

    /* Progress Loader Track */
    .splash-progress-track {
      position: relative;
      margin-top: 26px;
      width: 140px;
      height: 4.5px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.12);
      overflow: hidden;
    }
    .dark .splash-progress-track {
      background: rgba(255, 255, 255, 0.08);
    }
    .splash-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
      animation: splashProgress 1.4s ease-in-out infinite;
    }

    /* Bottom Motivational Quote Chip */
    .splash-quote {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      max-width: 90vw;
      text-align: center;
    }
    .dark .splash-quote {
      background: rgba(15, 23, 42, 0.55);
      border-color: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    /* Keyframe Animations */
    @keyframes splashFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1.2deg);
      }
    }
    @keyframes splashPulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.8;
      }
    }
    @keyframes splashProgress {
      0% {
        left: -60%;
        width: 40%;
      }
      50% {
        left: 20%;
        width: 70%;
      }
      100% {
        left: 110%;
        width: 40%;
      }
    }
  </style>
</head>

<body>
  <!-- Seamless Instant Inlined Boot Splash Screen -->
  <div id="app-boot-splash">
    <div class="splash-glow-1"></div>
    <div class="splash-glow-2"></div>

    <div class="splash-mascot-box">
      <div class="splash-mascot-halo"></div>
      <img src="./mascot.png" alt="T-English Mascot" class="splash-mascot-img" onerror="this.onerror=null; this.src='/mascot.png';" />
    </div>

    <h1 class="splash-brand">T-English</h1>
    <p class="splash-tagline">Học tiếng Anh thông minh • Bứt phá TOEIC</p>

    <div class="splash-progress-track">
      <div class="splash-progress-bar"></div>
    </div>
  </div>

  <script>
    (function () {
      setTimeout(function () {
        var splash = document.getElementById('app-boot-splash');
        if (splash && !splash.classList.contains('splash-fade-out')) {
          splash.classList.add('splash-fade-out');
          setTimeout(function () {
            try { splash.remove(); } catch (err) {}
          }, 550);
        }
      }, 5000);
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
